name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-portable:
    name: Linux portable (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev zip

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release

      - name: Build Linux portable zip
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          bash scripts/installer/linux/package-portable.sh "$VERSION" x64

      - name: Install rpm tooling
        run: sudo apt-get install -y rpm

      - name: Build deb and rpm packages
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          bash scripts/installer/linux/package-deb.sh "$VERSION"
          bash scripts/installer/linux/package-rpm.sh "$VERSION"

      - name: Inspect package layout
        run: |
          set -euo pipefail
          DEB="$(ls dist/linux/*.deb)"
          RPM="$(ls dist/linux/*.rpm)"
          dpkg-deb --info "$DEB"
          for path in             ./usr/bin/codex-plus-plus             ./usr/bin/codex-plus-plus-manager             ./usr/share/applications/codex-plus-plus.desktop             ./usr/share/applications/codex-plus-plus-manager.desktop             ./usr/share/icons/hicolor/256x256/apps/codex-plus-plus.png; do
            dpkg-deb --contents "$DEB" | awk '{print $6}' | grep -qx "$path"
            rpm -qpl "$RPM" | grep -qx "${path#.}"
          done
          echo "package layout verified"

      - name: Upload Linux packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/linux/*.zip
            dist/linux/*.zip.sha256
            dist/linux/*.deb
            dist/linux/*.deb.sha256
            dist/linux/*.rpm
            dist/linux/*.rpm.sha256

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs:
      - linux-portable
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          mkdir -p digests
          gh release download "$TAG" --repo "$REPO" --pattern "*.sha256" --dir digests || true
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          // <asset>.zip.sha256 内容形如 "<hex>  <asset>.zip"，映射到对应 asset。
          const digests = {};
          for (const file of fs.existsSync("digests") ? fs.readdirSync("digests") : []) {
            const line = fs.readFileSync(path.join("digests", file), "utf8").trim();
            const match = line.match(/^([0-9a-fA-F]{64})\s+\*?(.+)$/);
            if (match) {
              digests[match[2].trim()] = match[1].toLowerCase();
            }
          }
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json" && !name.endsWith(".sha256"))
            .map((name) => ({
              name,
              url: `${baseUrl}/${encodeURIComponent(name)}`,
              ...(digests[name] ? { sha256: digests[name] } : {})
            }));
          const payload = {
            version: `v${version}`,
            url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"
