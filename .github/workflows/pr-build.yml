name: PR build artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-portable:
    name: Linux portable (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev zip

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Build Linux portable zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          bash scripts/installer/linux/package-portable.sh "$VERSION" x64

      - name: Isolated XDG install smoke test
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          unzip -q dist/linux/CodexPlusPlus-*-linux-x64.zip -d "$SMOKE/extracted"
          HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/home/.local/share" \
            bash "$SMOKE/extracted/install.sh"
          LIB_ROOT="$SMOKE/home/.local/lib/codex-plus-plus"
          test -L "$LIB_ROOT/current"
          readlink "$LIB_ROOT/current" | grep -q '^versions/'
          test -x "$LIB_ROOT/current/bin/codex-plus-plus"
          test -x "$LIB_ROOT/current/bin/codex-plus-plus-manager"
          test -f "$LIB_ROOT/current/install-manifest.json"
          grep -q 'Codex++ user install' "$LIB_ROOT/current/install-manifest.json"
          grep -q "Exec=\"$LIB_ROOT/current/bin/codex-plus-plus\" %U" \
            "$SMOKE/home/.local/share/applications/codex-plus-plus.desktop"
          test -f "$SMOKE/home/.local/share/icons/hicolor/256x256/apps/codex-plus-plus.png"
          echo "smoke test passed"

      - name: Upload Linux portable zip
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-linux-x64-portable
          path: |
            dist/linux/*.zip
            dist/linux/*.sha256
          if-no-files-found: error
